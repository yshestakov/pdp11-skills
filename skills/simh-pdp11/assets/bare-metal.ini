; Run a stand-alone program (no OS) from an absolute-loader image.
; Usage: simh-pdp11 bare-metal.ini prog.lda      (%1 = first argument after the ini)
set cpu 11/70
set cpu 256K
load %1
; LOAD sets PC from the loader's end block (the .END transfer address)
go
; reached when the program HALTs (or ^E is typed)
echo ==REGS==
ex r0-r5,sp,pc,psw
exit
