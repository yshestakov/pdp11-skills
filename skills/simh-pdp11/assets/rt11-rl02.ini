; RT-11 on an RL02 system disk - tested with RT-11 V5.3 (rtv53_rl.dsk) on SIMH 3.9-0
; Usage: simh-pdp11 rt11-rl02.ini   (or scripts/rt11_do.py rt11-rl02.ini CMD ...)
; Edit SYSDISK / DATADISK lines; paths are relative to the directory SIMH runs in.
set cpu 11/73
set cpu 256K
; disable devices RT-11 doesn't need (faster boot, no probe noise)
set tm disabled
set ts disabled
set tq disabled
set rp disabled
set hk disabled
set xq disabled
set rq disabled
set rl enabled
set rl0 rl02
attach rl0 rt11-work.dsk
; optional second drive for data (create with: rt11fs.py init data.dsk --type rl02)
set rl1 rl02
; attach rl1 data.dsk
; optional printer capture: RT-11 'PRINT X.LST' or 'COPY X.MAC LP:' lands here
; (do 'SET LP LC' in RT-11 first or the LP handler upper-cases everything)
; ATTACH of an existing file rewrites it from byte 0 WITHOUT truncating (stale tail
; survives), so delete it first with the host shell escape:
! rm -f printer.txt
attach lpt printer.txt
boot rl0
